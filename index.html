<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Style Home</title>

    <style>
        /* RESET: Togliamo i margini di base del browser */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            /* Font tipico svizzero: pulito e senza grazie */
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
        }

        /* BARRA DI NAVIGAZIONE */
        .navbar {
            width: 100%;
            padding: 20px 40px; 
            border-bottom: 2px solid #000000; /* Il tuo filetto nero */
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Logo ancorato a sinistra */
        }

        /* IL TUO LOGO */
        .logo-container img {
            height: 60px; /* Qui decidi quanto deve essere piccolo */
            width: auto;
            display: block;
        }
        /* Questo serve ad allineare logo e testo */
.logo-container {
    display: flex;
    align-items: center;
    gap: 15px; /* Lo spazio tra logo e scritta */
}

/* Questo definisce lo stile della scritta */
.logo-text {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
}

        /* AREA CONTENUTO (ESEMPIO) */
        .content {
            padding: 40px;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo-container">
        <img src="assets/Artboard 1.png" alt="Logo">
        <span class="logo-text">Kiki's home page</span>
    </div>
    
    <ul class="nav-menu">
        <li><a href="#">Esercizi</a></li>
        <li><a href="#">Info</a></li>
    </ul>
</nav>
</body>
</html>
